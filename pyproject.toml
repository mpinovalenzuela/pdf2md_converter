[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf2md-converter"
version = "0.1.0"
description = "Convertidor de PDFs de modelos de datos (Oracle Data Modeler) a Markdown estructurado, CSV y JSON, orientado a alimentar un pipeline RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "pdf2md-converter contributors" }]
keywords = ["pdf", "markdown", "docling", "rag", "data-modeler", "oracle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "docling>=2.0.0",
    "pymupdf>=1.24.0",
    "pandas>=2.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "isort>=5.13.0",
]

[project.scripts]
pdf2md = "pdf2md_converter.main:app"

[project.urls]
Homepage = "https://github.com/your-org/pdf2md-converter"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2md_converter"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# E501: line length is handled by black/isort.
# B008: Typer requires `typer.Option(...)`/`typer.Argument(...)` as parameter
# defaults for its CLI introspection to work.
ignore = ["E501", "B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=pdf2md_converter --cov-report=term-missing"

[tool.coverage.run]
source = ["src/pdf2md_converter"]
